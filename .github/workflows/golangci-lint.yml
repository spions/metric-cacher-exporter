name: golangci-lint

on:
  push:
    branches: [main]
    paths:
      - "go.sum"
      - "go.mod"
      - "**.go"
      - ".golangci.yml"
      - ".github/workflows/golangci-lint.yml"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0  # keep in sync with .pre-commit-config.yaml
          args: --verbose
